<style>
:root{--ink:#0c0a09;--muted:#78716c;--line:#e7e5e4;--paper:#fff;--fog:#fafaf9;--blue:#1d7fc4;--sky:#e0f2fe;--shadow:0 5px 20px rgba(0,0,0,.05);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--fog);color:var(--ink)}a{color:var(--blue);text-decoration:none}button,select,input{font:inherit}.top{height:54px;padding:0 24px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between}.top h1{font:600 19px Georgia,serif;margin:0}.nav{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 54px)}.rail{border-right:1px solid var(--line);padding:18px 14px;background:#fff}.rail input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px}.group{margin:18px 4px 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.series{width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 8px;cursor:pointer;font-size:12px}.series:hover{background:var(--fog)}.series.sel{background:var(--sky);color:#075985;font-weight:650}.series.off{color:#a8a29e}.main{padding:24px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.head h2{font:600 28px Georgia,serif;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.actions,.controls,.ranges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #d6d3d1;background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}button:hover{border-color:#78716c}.controls{margin:18px 0 10px}.ranges button.on{background:var(--ink);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}.chart-title{display:flex;justify-content:space-between;padding:7px 9px 0;font-size:12px}.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--c);margin-right:5px}.latest{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}.latest>div{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px}.latest b{font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.notice{padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;font-size:12px;margin:10px 0}.tip{position:fixed;display:none;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:8px 10px;border-radius:8px;font-size:11px;z-index:10}.details{font-size:12px;color:var(--muted);line-height:1.6}.drawer{display:none}@media(max-width:760px){.layout{display:block}.rail{display:none;position:fixed;z-index:20;inset:54px 0 0;width:290px;overflow:auto;box-shadow:8px 0 30px rgba(0,0,0,.15)}.rail.open{display:block}.drawer{display:inline-block}.main{padding:16px}.top{padding:0 14px}.head{display:block}.actions{margin-top:10px}.card{padding:6px}}
